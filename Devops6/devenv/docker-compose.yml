# Dev-окружение: Gitea + Redmine + Drone CI + Docker Registry
# Запуск:  docker compose up -d
# Порты:   Gitea 3001, Redmine 3000, Drone 8000, Registry 5000
#
# Gitea, Drone-сервер и раннер работают в сети хоста (network_mode: host):
# так адреса localhost:3001 и localhost:8000 одинаково доступны браузеру,
# OAuth-перенаправлениям и вебхукам Gitea -> Drone.

services:
  gitea:
    image: gitea/gitea:latest
    restart: always
    network_mode: host
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__HTTP_PORT=3001
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__DISABLE_SSH=true
      # вебхуки на Drone (localhost:8000) и во внутренние сети
      - GITEA__webhook__ALLOWED_HOST_LIST=loopback,private,external
    volumes:
      - gitea:/data

  redmine-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
    volumes:
      - redmine-db:/var/lib/postgresql/data

  redmine:
    image: redmine
    restart: always
    ports:
      - 3000:3000
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
    depends_on:
      - redmine-db
    volumes:
      - redmine-files:/usr/src/redmine/files

  drone:
    image: drone/drone:2
    restart: always
    network_mode: host
    environment:
      - DRONE_GITEA_SERVER=http://localhost:3001
      - DRONE_GITEA_CLIENT_ID=${DRONE_GITEA_CLIENT_ID}
      - DRONE_GITEA_CLIENT_SECRET=${DRONE_GITEA_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_SERVER_HOST=localhost:8000
      - DRONE_SERVER_PROTO=http
      - DRONE_SERVER_PORT=:8000
      - DRONE_USER_CREATE=username:${DRONE_ADMIN:-student},admin:true
    volumes:
      - drone:/data
    depends_on:
      - gitea

  drone-runner:
    image: drone/drone-runner-docker:1
    restart: always
    network_mode: host
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=localhost:8000
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_RUNNER_NAME=runner1
      - DRONE_RUNNER_CAPACITY=1
      - DRONE_HTTP_BIND=:3002
      # Docker-сокет хоста подключается ко всем контейнерам сборки:
      # шаги конвейера собирают и публикуют образы через Docker хоста
      # (без флага Trusted у репозитория).
      - DRONE_RUNNER_VOLUMES=/var/run/docker.sock:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - drone

  registry:
    image: registry:2
    restart: always
    ports:
      - 5000:5000
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry:/var/lib/registry

volumes:
  gitea:
  redmine-db:
  redmine-files:
  drone:
  registry:
